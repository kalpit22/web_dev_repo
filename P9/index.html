<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and Grid</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <h1>Flexbox Layout</h1>
    <section class="flex">
        <div>Home</div>
        <div>About</div>
        <div>Contact</div>
    </section>

    <h1>Grid Layout</h1>
    <section class="grid">
        <div>HTML</div>
        <div>CSS</div>
        <div>JavaScript</div>
    </section>

</body>
</html>
