<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Layout</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header>
        <h1>Daily News</h1>
        <p>Today's latest stories</p>
    </header>

    <main class="container">
        <article class="box">
            <h2>World News</h2>
            <p>Important updates from around the world.</p>
        </article>
        <article class="box">
            <h2>Sports News</h2>
            <p>Scores, teams, and highlights from today.</p>
        </article>
        <article class="box">
            <h2>Technology News</h2>
            <p>New ideas and tools shaping the future.</p>
        </article>
    </main>

</body>
</html>
